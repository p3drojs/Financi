openapi: 3.0.3
info:
  title: Financi API
  description: API do Financi — controle financeiro pessoal.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Ambiente local

tags:
  - name: Health
    description: Status da API
  - name: Auth
    description: Cadastro e autenticação de usuário
  - name: Categories
    description: Categorias de receita/despesa
  - name: Tags
    description: Tags livres aplicadas a transações
  - name: Transactions
    description: Transações, recorrências e parcelamentos
  - name: Dashboard
    description: Agregações e relatórios
  - name: Accounts
    description: Contas, saldos e transferencias
  - name: Budgets
    description: Teto de gasto por categoria, mes a mes
  - name: Goals
    description: Metas de poupanca e aportes

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: API funcionando normalmente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Cria um novo usuário
      description: >
        Junto com o usuário são criadas as categorias padrão (receita e despesa),
        para a conta não começar vazia. Elas são categorias comuns e podem ser
        renomeadas ou excluídas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Erro de validação dos dados enviados
        '409':
          description: Já existe um usuário com esse email

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autentica um usuário existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Email ou senha inválidos

  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna o usuário autenticado
      responses:
        '200':
          description: Usuário atual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token ausente ou inválido

  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Troca um refresh token válido por um par novo de tokens
      description: >
        O refresh token usado é revogado (rotação) — cada refresh token só pode
        ser usado uma vez.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          description: Par novo de tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token inválido, revogado ou expirado

  /auth/logout:
    post:
      tags: [Auth]
      security: []
      summary: Revoga um refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '204':
          description: Sessão encerrada (sempre retorna 204, mesmo se o token já não existir)

  /categories:
    get:
      tags: [Categories]
      summary: Lista as categorias do usuário autenticado
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Cria uma categoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryInput'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '409':
          description: Já existe categoria com esse nome+tipo

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Categories]
      summary: Busca uma categoria por id
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Categoria não encontrada
    patch:
      tags: [Categories]
      summary: Atualiza nome/cor de uma categoria
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                color:
                  type: string
      responses:
        '200':
          description: Categoria atualizada
    delete:
      tags: [Categories]
      summary: Exclui uma categoria (bloqueado se estiver em uso)
      responses:
        '204':
          description: Excluída com sucesso
        '409':
          description: Categoria em uso por transações/recorrências

  /tags:
    get:
      tags: [Tags]
      summary: Lista as tags do usuário autenticado
      responses:
        '200':
          description: Lista de tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

  /tags/{id}:
    delete:
      tags: [Tags]
      parameters:
        - $ref: '#/components/parameters/IdParam'
      summary: Exclui uma tag (bloqueado se estiver em uso)
      responses:
        '204':
          description: Excluída com sucesso
        '409':
          description: Tag em uso por transações

  /transactions:
    get:
      tags: [Transactions]
      summary: Lista transações do usuário, com filtros e paginação
      description: >
        Antes de responder, estende o lote das recorrências ativas que ficaram
        para trás da janela de 12 meses, criando as ocorrências que faltam.
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: tag
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Página de transações
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
    post:
      tags: [Transactions]
      summary: Cria uma transação única
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionInput'
      responses:
        '201':
          description: Transação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Tipo da transação não bate com o tipo da categoria

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    get:
      tags: [Transactions]
      summary: Busca uma transação por id
      responses:
        '200':
          description: Transação encontrada
    patch:
      tags: [Transactions]
      summary: Edita uma transação (afeta só essa ocorrência, mesmo se for recorrente/parcelada)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                categoryId: { type: string, format: uuid }
                amount: { type: number }
                description: { type: string }
                date: { type: string, format: date-time }
                tagNames:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: Transação atualizada
    delete:
      tags: [Transactions]
      summary: Exclui uma transação (só essa ocorrência)
      responses:
        '204':
          description: Excluída com sucesso

  /transactions/recurring:
    get:
      tags: [Transactions]
      summary: Lista as recorrências do usuário
      description: >
        Antes de responder, estende o lote das recorrências ativas que ficaram
        para trás da janela de 12 meses.
      parameters:
        - name: active
          in: query
          schema: { type: string, enum: ['true', 'false'] }
          description: Filtra por recorrências ativas ou canceladas. Omitido, retorna todas.
      responses:
        '200':
          description: Lista de recorrências
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecurrenceListItem'
    post:
      tags: [Transactions]
      summary: Cria uma transação recorrente (gera um lote de ocorrências pré-geradas)
      description: >
        Gera imediatamente as ocorrências futuras (Transaction) até o menor entre:
        endDate, occurrences ou uma janela de 12 meses a partir de hoje. O lote é
        estendido depois, sob demanda, na leitura de /transactions e
        /transactions/recurring.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringTransactionInput'
      responses:
        '201':
          description: Recorrência criada com o lote de transações geradas
          content:
            application/json:
              schema:
                type: object
                properties:
                  recurrence:
                    $ref: '#/components/schemas/Recurrence'
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'

  /transactions/recurring/{recurrenceId}:
    parameters:
      - name: recurrenceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Transactions]
      summary: Edita o template de uma recorrência ativa (vale só para ocorrências futuras)
      description: >
        Alterações de valor, categoria ou descrição são aplicadas nas ocorrências
        futuras existentes. Alterar intervalMonths, endDate ou occurrences
        regera as ocorrências futuras a partir do novo cronograma. Ocorrências
        passadas nunca são tocadas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurrenceInput'
      responses:
        '200':
          description: Recorrência atualizada com as ocorrências futuras resultantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  recurrence:
                    $ref: '#/components/schemas/Recurrence'
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        '404':
          description: Recorrência não encontrada
        '409':
          description: Recorrência cancelada não pode ser editada
    delete:
      tags: [Transactions]
      summary: Cancela uma recorrência (remove só ocorrências futuras, preserva histórico)
      responses:
        '204':
          description: Recorrência cancelada
        '404':
          description: Recorrência não encontrada

  /transactions/installments:
    post:
      tags: [Transactions]
      summary: Cria uma compra parcelada (gera N transações com o valor total dividido)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstallmentTransactionInput'
      responses:
        '201':
          description: Parcelas criadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'

  /transactions/installments/{groupId}:
    get:
      tags: [Transactions]
      summary: Mostra um parcelamento agrupado (ex. "3 de 5 pagas")
      description: >
        Uma parcela é contada como paga quando a data dela já venceu — não há
        marcação manual de pagamento no MVP.
      parameters:
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resumo do grupo de parcelas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallmentGroup'
        '404':
          description: Parcelamento não encontrado

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Total de receitas, despesas e saldo num período
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Resumo financeiro
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalIncome: { type: string }
                  totalExpense: { type: string }
                  balance: { type: string }

  /dashboard/by-category:
    get:
      tags: [Dashboard]
      summary: Total gasto/recebido agrupado por categoria
      parameters:
        - name: dateFrom
          in: query
          schema: { type: string, format: date-time }
        - name: dateTo
          in: query
          schema: { type: string, format: date-time }
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TransactionType'
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Totais por categoria

  /dashboard/balance-evolution:
    get:
      tags: [Dashboard]
      summary: Evolução de receita/despesa/saldo mês a mês
      parameters:
        - name: months
          in: query
          schema: { type: integer, default: 6 }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Série mensal de receita/despesa/saldo

  /accounts:
    get:
      tags: [Accounts]
      summary: Lista as contas com saldo calculado
      parameters:
        - name: includeArchived
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Contas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      tags: [Accounts]
      summary: Cria uma conta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountInput'
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '409':
          description: Já existe uma conta com esse nome

  /accounts/transfers:
    post:
      tags: [Accounts]
      summary: Move dinheiro entre duas contas
      description: >
        Cria duas transações irmãs ligadas por transferGroupId — uma EXPENSE na origem e uma
        INCOME no destino, ambas na categoria de sistema "Transferência". Conta no saldo das
        contas e nunca em agregado de receita/despesa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransferInput'
      responses:
        '201':
          description: Transferência criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transfer'
        '400':
          description: Contas iguais, arquivadas ou valor inválido
        '404':
          description: Conta não encontrada

  /accounts/transfers/{transferGroupId}:
    delete:
      tags: [Accounts]
      summary: Apaga as duas pontas de uma transferência
      parameters:
        - name: transferGroupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Transferência apagada
        '404':
          description: Transferência não encontrada

  /accounts/{id}:
    get:
      tags: [Accounts]
      summary: Conta, saldo e últimas 20 transações
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Conta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '404':
          description: Conta não encontrada
    patch:
      tags: [Accounts]
      summary: Atualiza nome, cor, saldo inicial ou arquivamento
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountInput'
      responses:
        '200':
          description: Conta atualizada
        '409':
          description: Já existe uma conta com esse nome
    delete:
      tags: [Accounts]
      summary: Apaga uma conta sem lançamentos
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Conta apagada
        '409':
          description: A conta tem lançamentos — arquive em vez de apagar

  /transactions/pay:
    post:
      tags: [Transactions]
      summary: Marca lançamentos como pagos em lote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Quantidade efetivamente marcada
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }

  /transactions/upcoming:
    get:
      tags: [Transactions]
      summary: O que venceu e o que vence na janela pedida
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
      responses:
        '200':
          description: Vencidos e a vencer, já sem transferências
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingResponse'

  /dashboard/forecast:
    get:
      tags: [Dashboard]
      summary: Projeta o saldo até uma data, com o ponto mais baixo do caminho
      parameters:
        - name: until
          in: query
          schema: { type: string, format: date }
        - name: accountId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Previsão diária até a data pedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forecast'

  /budgets:
    get:
      tags: [Budgets]
      summary: Tetos do mês com o que já saiu e o que está prometido
      parameters:
        - name: month
          in: query
          schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
      responses:
        '200':
          description: Envelope do mês
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BudgetEnvelope'
    post:
      tags: [Budgets]
      summary: Cria um teto para uma categoria de saída
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudgetInput'
      responses:
        '201':
          description: Teto criado
        '400':
          description: Categoria de entrada, de sistema, ou mês fora do formato
        '409':
          description: Esta categoria já tem teto neste mês

  /budgets/copy:
    post:
      tags: [Budgets]
      summary: Copia os tetos de um mês para outro, pulando os que já existem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromMonth, toMonth]
              properties:
                fromMonth: { type: string, example: '2026-07' }
                toMonth: { type: string, example: '2026-08' }
      responses:
        '201':
          description: Quantos foram criados e quantos foram pulados
          content:
            application/json:
              schema:
                type: object
                properties:
                  created: { type: integer }
                  skipped: { type: integer }

  /budgets/{id}:
    patch:
      tags: [Budgets]
      summary: Muda o valor do teto
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: number }
      responses:
        '200':
          description: Teto atualizado
    delete:
      tags: [Budgets]
      summary: Apaga o teto
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Teto apagado

  /goals:
    get:
      tags: [Goals]
      summary: Lista as metas com progresso calculado
      parameters:
        - name: includeArchived
          in: query
          schema: { type: string, enum: ['true', 'false'] }
      responses:
        '200':
          description: Metas do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
    post:
      tags: [Goals]
      summary: Cria uma meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalInput'
      responses:
        '201':
          description: Meta criada
        '400':
          description: Data-alvo no passado
        '409':
          description: Já existe uma meta com esse nome

  /goals/{id}:
    get:
      tags: [Goals]
      summary: Meta com aportes e derivados
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Meta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '404':
          description: Meta não encontrada
    patch:
      tags: [Goals]
      summary: Atualiza a meta
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalInput'
      responses:
        '200':
          description: Meta atualizada
    delete:
      tags: [Goals]
      summary: Apaga a meta e seus aportes, preservando os lançamentos
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Meta apagada

  /goals/{id}/contributions:
    post:
      tags: [Goals]
      summary: Registra um aporte
      description: >
        Com fromAccountId e meta que tenha accountId, o aporte cria uma transferência da conta
        de origem para a conta da meta e guarda o vínculo. Sem fromAccountId, é só escrituração
        e nenhuma conta se mexe.
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContributionInput'
      responses:
        '201':
          description: Meta com o aporte já somado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          description: fromAccountId numa meta sem conta vinculada
        '409':
          description: Este lançamento já está ligado a um aporte

  /goals/{id}/contributions/{contributionId}:
    delete:
      tags: [Goals]
      summary: Apaga um aporte, desfazendo a transferência que o financiou
      parameters:
        - $ref: '#/components/parameters/IdParam'
        - name: contributionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Meta recalculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    TransactionType:
      type: string
      enum: [INCOME, EXPENSE]


    AccountKind:
      type: string
      enum: [CHECKING, SAVINGS, CASH, CREDIT_CARD, INVESTMENT]

    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          $ref: '#/components/schemas/AccountKind'
        color: { type: string, nullable: true }
        initialBalance: { type: string }
        archived: { type: boolean }
        balance:
          type: string
          description: initialBalance mais entradas pagas menos saídas pagas, só o que já venceu

    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/Account'
        - type: object
          properties:
            transactions:
              type: array
              items:
                $ref: '#/components/schemas/Transaction'

    CreateAccountInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 60 }
        kind:
          $ref: '#/components/schemas/AccountKind'
        color: { type: string }
        initialBalance: { type: number }

    UpdateAccountInput:
      type: object
      properties:
        name: { type: string, maxLength: 60 }
        color: { type: string, nullable: true }
        initialBalance: { type: number }
        archived: { type: boolean }

    CreateTransferInput:
      type: object
      required: [fromAccountId, toAccountId, amount, date]
      properties:
        fromAccountId: { type: string, format: uuid }
        toAccountId: { type: string, format: uuid }
        amount: { type: number }
        date: { type: string, format: date-time }
        description: { type: string }

    Transfer:
      type: object
      properties:
        transferGroupId: { type: string, format: uuid }
        from:
          $ref: '#/components/schemas/Transaction'
        to:
          $ref: '#/components/schemas/Transaction'

    UpcomingBucket:
      type: object
      properties:
        total: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'

    UpcomingResponse:
      type: object
      properties:
        overdue:
          $ref: '#/components/schemas/UpcomingBucket'
        upcoming:
          $ref: '#/components/schemas/UpcomingBucket'

    ForecastPoint:
      type: object
      properties:
        date: { type: string, format: date }
        balance: { type: string }

    Forecast:
      type: object
      properties:
        asOf: { type: string, format: date }
        until: { type: string, format: date }
        currentBalance: { type: string }
        pendingIncome: { type: string }
        pendingExpense: { type: string }
        overdue:
          type: object
          properties:
            count: { type: integer }
            total: { type: string }
        projectedBalance: { type: string }
        lowestPoint:
          allOf:
            - $ref: '#/components/schemas/ForecastPoint'
          nullable: true
        daily:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPoint'
        truncated:
          type: boolean
          description: >
            true quando until foi recuado para a janela de recorrência já materializada —
            a previsão não alcança a data pedida

    BudgetStatus:
      type: string
      enum: [OK, WARNING, OVER]

    BudgetItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        categoryName: { type: string }
        color: { type: string, nullable: true }
        amount: { type: string }
        spent:
          type: string
          description: só o que já foi pago
        committed:
          type: string
          description: tudo lançado no mês, vencido ou não
        remaining: { type: string }
        percent: { type: number }
        status:
          $ref: '#/components/schemas/BudgetStatus'

    BudgetEnvelope:
      type: object
      properties:
        month: { type: string, example: '2026-08' }
        totalBudgeted: { type: string }
        totalSpent: { type: string }
        totalCommitted: { type: string }
        items:
          type: array
          items:
            $ref: '#/components/schemas/BudgetItem'

    CreateBudgetInput:
      type: object
      required: [categoryId, month, amount]
      properties:
        categoryId: { type: string, format: uuid }
        month: { type: string, example: '2026-08' }
        amount: { type: number }

    GoalContribution:
      type: object
      properties:
        id: { type: string, format: uuid }
        amount: { type: string }
        date: { type: string, format: date-time }
        transactionId: { type: string, format: uuid, nullable: true }

    Goal:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        targetAmount: { type: string }
        targetDate: { type: string, format: date-time, nullable: true }
        accountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        archived: { type: boolean }
        achievedAt: { type: string, format: date-time, nullable: true }
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/GoalContribution'
        saved: { type: string }
        progress: { type: number, nullable: true }
        remaining: { type: string }
        requiredMonthly:
          type: string
          nullable: true
          description: null sem data-alvo ou com data-alvo já vencida
        pace:
          type: string
          nullable: true
          description: null com menos de um mês de histórico
        projectedDate: { type: string, format: date-time, nullable: true }
        onTrack: { type: boolean, nullable: true }

    CreateGoalInput:
      type: object
      required: [name, targetAmount]
      properties:
        name: { type: string, maxLength: 80 }
        targetAmount: { type: number }
        targetDate: { type: string, format: date-time }
        accountId: { type: string, format: uuid }
        color: { type: string }

    UpdateGoalInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        targetAmount: { type: number }
        targetDate: { type: string, format: date-time, nullable: true }
        accountId: { type: string, format: uuid, nullable: true }
        color: { type: string, nullable: true }
        archived: { type: boolean }

    CreateContributionInput:
      type: object
      required: [amount, date]
      properties:
        amount: { type: number }
        date: { type: string, format: date-time }
        transactionId:
          type: string
          format: uuid
          description: liga o aporte a um lançamento que já existe
        fromAccountId:
          type: string
          format: uuid
          description: >
            move dinheiro de verdade — cria uma transferência desta conta para a conta da meta

    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          nullable: true

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT de acesso, curta duração
        refreshToken:
          type: string
          description: Token opaco de longa duração, usado em /auth/refresh

    RefreshInput:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    Category:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type:
          $ref: '#/components/schemas/TransactionType'
        color: { type: string, nullable: true }

    CreateCategoryInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          $ref: '#/components/schemas/TransactionType'
        color: { type: string }

    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/TransactionType'
        amount: { type: string }
        description: { type: string, nullable: true }
        date: { type: string, format: date-time }
        recurrenceId: { type: string, format: uuid, nullable: true }
        installmentGroupId: { type: string, format: uuid, nullable: true }
        installmentNumber: { type: integer, nullable: true }
        installmentTotal: { type: integer, nullable: true }
        accountId: { type: string, format: uuid }
        transferGroupId: { type: string, format: uuid, nullable: true }
        paid: { type: boolean }
        paidAt: { type: string, format: date-time, nullable: true }

    CreateTransactionInput:
      type: object
      required: [categoryId, type, amount, date]
      properties:
        categoryId: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/TransactionType'
        amount: { type: number }
        description: { type: string }
        date: { type: string, format: date-time }
        tagNames:
          type: array
          items: { type: string }

    CreateRecurringTransactionInput:
      allOf:
        - $ref: '#/components/schemas/CreateTransactionInput'
        - type: object
          required: [startDate, intervalMonths]
          properties:
            startDate: { type: string, format: date-time }
            intervalMonths: { type: integer, minimum: 1, maximum: 60 }
            endDate: { type: string, format: date-time }
            occurrences: { type: integer, minimum: 1, maximum: 600 }

    CreateInstallmentTransactionInput:
      allOf:
        - $ref: '#/components/schemas/CreateTransactionInput'
        - type: object
          required: [startDate, installmentTotal]
          properties:
            startDate: { type: string, format: date-time }
            installmentTotal: { type: integer, minimum: 2, maximum: 60 }

    Recurrence:
      type: object
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        type:
          $ref: '#/components/schemas/TransactionType'
        amount: { type: string }
        intervalMonths: { type: integer }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time, nullable: true }
        occurrences: { type: integer, nullable: true }
        active: { type: boolean }

    RecurrenceListItem:
      allOf:
        - $ref: '#/components/schemas/Recurrence'
        - type: object
          properties:
            category:
              $ref: '#/components/schemas/Category'
            generatedCount:
              type: integer
              description: Total de ocorrências já geradas
            lastOccurrenceDate: { type: string, format: date-time, nullable: true }
            upcomingCount:
              type: integer
              description: Ocorrências futuras ainda não vencidas
            nextOccurrenceDate: { type: string, format: date-time, nullable: true }

    UpdateRecurrenceInput:
      type: object
      properties:
        categoryId: { type: string, format: uuid }
        amount: { type: number }
        description: { type: string }
        intervalMonths: { type: integer, minimum: 1, maximum: 60 }
        endDate: { type: string, format: date-time, nullable: true }
        occurrences: { type: integer, minimum: 1, maximum: 600, nullable: true }

    InstallmentGroup:
      type: object
      properties:
        installmentGroupId: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        category:
          $ref: '#/components/schemas/Category'
        type:
          $ref: '#/components/schemas/TransactionType'
        description: { type: string, nullable: true }
        installmentTotal: { type: integer }
        installmentsGenerated: { type: integer }
        paidCount: { type: integer }
        remainingCount: { type: integer }
        totalAmount: { type: string }
        paidAmount: { type: string }
        remainingAmount: { type: string }
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
