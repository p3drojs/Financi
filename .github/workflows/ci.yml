name: CI Backend

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/backend

jobs:
  test-and-analyze:
    runs-on: self-hosted

    env:
      DATABASE_URL: postgresql://financi:financi@localhost:5439/financi_dev?schema=public
      DATABASE_URL_TEST: postgresql://financi:financi@localhost:5439/financi_test?schema=public
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'ci-test-secret-nao-usar-em-producao' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Aplicar migrations no banco de teste
        run: npm run prisma:migrate:deploy

      - name: Testes unitários
        run: npm run test:unit -- --coverage

      - name: Testes e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Análise SonarQube
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: apps/backend
        env:
          SONAR_HOST_URL: http://localhost:9000
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  mutation-testing:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    needs: test-and-analyze
    env:
      DATABASE_URL: postgresql://financi:financi@localhost:5439/financi_dev?schema=public
      DATABASE_URL_TEST: postgresql://financi:financi@localhost:5439/financi_test?schema=public
      JWT_SECRET: ${{ secrets.JWT_SECRET_TEST || 'ci-test-secret-nao-usar-em-producao' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run prisma:generate

      - name: Rodar mutation testing
        run: npm run test:mutation

      - name: Publicar relatório de mutation testing
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: apps/backend/reports/mutation

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    needs: test-and-analyze
    steps:
      - name: Disparar deploy no Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
